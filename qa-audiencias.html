  return Promise.resolve({ datos: agenda.concat(deCitas) });
};

// «Decretar inspección»: marca el radicado en memoria (la siguiente lectura lo trae).
const DECRETADAS_QA = {};
window.decretarInspeccionAudiencias = function (f) {
  DECRETADAS_QA[f.RADICADO] = '05/04/2027 · ' + ROLES[ROL_QA].usuario;
  return Promise.resolve({ ok: true });
};
const _leerVisitasQA = window.leerVisitas;
window.leerVisitas = function () {

};

// ── Barra del banco ──
const ROLES = {
  admin: { usuario: 'DANIEL PEDRAZA', rol: 'ADMIN', cargo: 'Profesional Especializado' },
  sup: { usuario: 'PATRICIA LOPEZ', rol: 'SUPERVISOR', cargo: 'Sustanciadora' },
  insp: { usuario: 'ALEJANDRO HERNANDEZ', rol: 'INSPECTOR', cargo: 'Inspector' },
};
let ROL_QA = 'admin';
let AVISO_QA = '';
let SIN_SENAL_QA = false;
cargarDatosQA();
const bar = document.getElementById('qa-bar');
function renderBar() {
  bar.innerHTML = '';
  const seg = (items, actual, fn) => {
    items.forEach(function (it) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = it[1];
      b.className = it[0] === actual ? 'on' : '';
      b.onclick = function () { fn(it[0]); };
      bar.appendChild(b);
    });
  };
  seg([['admin', 'Admin'], ['sup', 'Supervisor (Patricia)'], ['insp', 'Inspector (Alejandro)']], ROL_QA, function (r) { ROL_QA = r; renderTodo(); });
  const sp = document.createElement('small'); sp.textContent = '«Hoy» es'; bar.appendChild(sp);
  seg([['2027-04-05', 'Lun 05/04'], ['2027-04-13', 'Mar 13/04 (bloq.)'], ['2027-04-08', 'Jue 08/04']], window._AU_HOY, function (h) { window._AU_HOY = h; renderTodo(); });
  sp2 = document.createElement('small'); sp2.textContent = 'Cupos'; bar.appendChild(sp2);
  seg([['', 'Hasta 30/12'], ['cerca', 'Por acabarse']], AVISO_QA, function (a) { AVISO_QA = a; cargarDatosQA(); renderTodo(); });
  const sp3 = document.createElement('small'); sp3.textContent = 'Señal'; bar.appendChild(sp3);
  seg([[false, 'Con señal'], [true, 'Sin señal']], SIN_SENAL_QA, function (v) { SIN_SENAL_QA = v; renderTodo(); });
  if (!CASO) {
    const vac = document.createElement('button');
    vac.type = 'button'; vac.textContent = '→ hoja vacía';
    vac.onclick = function () { location.search = '?caso=vacio'; };
    bar.appendChild(vac);
  } else {
    const back = document.createElement('button');
    back.type = 'button'; back.textContent = '→ datos';
    back.onclick = function () { location.search = ''; };
    bar.appendChild(back);
  }
}
var sp2;
var _qaRoot = null;
function renderTodo() {
  if (typeof window._AU_ULTIMO !== 'undefined') window._AU_ULTIMO = null;
  renderBar();
  if (!_qaRoot) _qaRoot = ReactDOM.createRoot(document.getElementById('root'));
  _qaRoot.render(
    React.createElement(AudienciasScreen, { usuario: ROLES[ROL_QA], key: ROL_QA + '|' + window._AU_HOY + '|' + AVISO_QA + '|' + CASO }));
}
renderTodo();
</script>
