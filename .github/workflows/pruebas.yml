# Corre `npm test` en cada push y PR. Las pruebas del backend se saltan solas:
# apps_script_unificado.js no está en este repo (tiene claves).
name: Pruebas
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
