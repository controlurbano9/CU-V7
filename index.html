<!-- QW32 (auditoría 2026-07): CSP básica — restringe scripts/estilos/conexiones a los
     CDNs realmente usados (React/unpkg, turf.js/cdnjs, Google Maps, Google Fonts,
     webhook Apps Script, GeoJSONs POT en raw.githubusercontent). 'unsafe-inline' en
     script-src es necesario por el <script> inline de registro del Service Worker;
     'unsafe-eval' por la API JS de Google Maps (histórico).
     *.googleusercontent.com en img-src: drive.google.com/thumbnail responde 302 a
     lh3.googleusercontent.com, y la CSP también se aplica al destino de la
     redirección — sin él no salen las miniaturas del modal de registro fotográfico.
     drive.google.com en frame-src (2026-10-02): el panel de Mis visitas muestra el
     PDF de la PQR con la vista previa de Drive (/file/d/<id>/preview). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://*.googleapis.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://drive.google.com https://*.googleusercontent.com;
  connect-src 'self' https://script.google.com https://script.googleusercontent.com https://raw.githubusercontent.com https://*.googleapis.com;
  frame-src 'self' https://drive.google.com;
  worker-src 'self' blob: https://cdnjs.cloudflare.com;
  object-src 'none';
  base-uri 'self';
">
<title>Control Urbano V6 · React</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=240">

<style>
  /* Hacer visible #pantalla-login aunque styles.css lo oculte por defecto */
  #pantalla-login { display: flex; }
  /* Root mounting point ocupa la pantalla */
  #root { min-height: 100vh; }

  /* ── Cascarón de arranque (propuesta de esperas, 2026-11-04) ──────────
     Antes, #root quedaba vacío hasta que corría el bundle: una pantalla de
     papel liso. Ahora se ve la app (cabecera negra, la forma de la primera
     pantalla del rol guardado y las pestañas) sin esperar a React ni a
     styles.css. createRoot().render() reemplaza este contenido al montar.
     Valores copiados de los tokens de styles.css (no está cargado aún). */
  body { margin: 0; background: #F6F5F2; }
  .casc { min-height: 100vh; font-family: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif; color: #15140F; }
  .casc-cab { position: relative; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; background: #15140F; color: #fff; font-weight: 700; font-size: 17px; }
  .casc-cab img { width: 32px; height: 32px; border-radius: 6px; background: #fff; padding: 2px; box-sizing: border-box; object-fit: contain; }
  .casc-barra { position: fixed; left: 0; right: 0; top: 53px; height: 3px; overflow: hidden; color: #fff; }
  .casc-login .casc-barra { top: 0; color: #F6F5F2; }
  .casc-barra::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; background: currentColor; animation: casc-correr 1.1s cubic-bezier(.4,0,.2,1) infinite; }
  .casc-lado { display: none; }
  .casc-cuerpo { padding: 16px 16px 96px; display: grid; align-content: start; gap: 12px; max-width: 760px; }
  .casc-tit { font-weight: 800; font-size: 30px; line-height: 1.1; margin: 4px 0 8px; }
  .casc-tit::before { content: "Mis visitas"; }
  .casc-admin .casc-tit::before { content: "Inicio"; }
  .casc-nav { position: fixed; left: 0; right: 0; bottom: 0; height: 72px; background: #fff; border-top: 1px solid rgba(21,20,15,.18); }
  .casc-e { display: block; position: relative; overflow: hidden; background: #ECEAE4; border-radius: 4px; }
  .casc-e::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, #E0DED7 50%, transparent); animation: casc-barrer 1.6s ease-in-out infinite; }
  .casc-placa, .casc-tv, .casc-ind { background: #fff; border: 1px solid rgba(21,20,15,.18); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
  .casc-placa { border-radius: 12px; padding: 16px; }
  .casc-l { height: 10px; } .casc-d { height: 14px; } .casc-g { height: 24px; } .casc-b { height: 44px; border-radius: 6px; }
  .casc-chips { display: flex; gap: 8px; } .casc-chips .casc-e { height: 36px; width: 96px; border-radius: 999px; }
  .casc-ind { grid-template-columns: 1fr 1fr; gap: 20px 16px; padding: 16px; }
  .casc-ind > div { display: grid; gap: 10px; }
  .casc-semana { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .casc-semana .casc-e { height: 52px; border-radius: 8px; }
  .casc-admin .casc-insp-only, .casc-insp .casc-admin-only { display: none; }
  .casc-login { background: #15140F; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .casc-login > :not(.casc-login-placa):not(.casc-barra) { display: none; }
  .casc-login-placa { display: none; }
  .casc-login .casc-login-placa { display: grid; gap: 12px; width: 100%; max-width: 380px; box-sizing: border-box; padding: 20px; background: #fff; border-radius: 12px; }
  @media (min-width: 900px) {
    .casc:not(.casc-login) { display: grid; grid-template-columns: 256px 1fr; }
    .casc-cab, .casc-nav { display: none; }
    .casc-lado { display: grid; align-content: start; gap: 14px; padding: 24px 20px; }
    .casc:not(.casc-login) .casc-barra { top: 0; color: #15140F; }
    .casc-lado .casc-e { height: 14px; }
    .casc-cuerpo { padding: 28px 32px; max-width: 1100px; }
    .casc-ind { grid-template-columns: repeat(4, 1fr); }
    .casc-semana .casc-e { height: 220px; }
  }
  @keyframes casc-barrer { to { transform: translateX(100%); } }
  @keyframes casc-correr { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .casc-e::after { display: none; }
    .casc-barra::before { animation: none; left: 0; width: 100%; opacity: .7; }
  }
</style>
</head>
<body>

<div id="root">
  <div class="casc casc-login" id="cu-cascaron" role="status" aria-busy="true" aria-label="Cargando Control Urbano">
    <div class="casc-cab"><img src="logo.jpg" alt=""><span>Control Urbano</span></div>
    <span class="casc-barra"></span>
    <div class="casc-lado"><span class="casc-e" style="width:70%"></span><span class="casc-e" style="width:55%"></span><span class="casc-e" style="width:62%"></span><span class="casc-e" style="width:48%"></span></div>
    <main class="casc-cuerpo">
      <div class="casc-tit"></div>
      <div class="casc-chips casc-insp-only"><span class="casc-e"></span><span class="casc-e"></span><span class="casc-e"></span></div>
      <div class="casc-placa casc-insp-only"><span class="casc-e casc-g" style="width:86%"></span><span class="casc-e casc-g" style="width:52%"></span><span class="casc-e casc-l" style="width:64%"></span><span class="casc-e casc-b"></span></div>
      <div class="casc-tv casc-insp-only"><span class="casc-e casc-l" style="width:40%"></span><span class="casc-e casc-d" style="width:78%"></span><span class="casc-e casc-l" style="width:60%"></span></div>
      <div class="casc-tv casc-insp-only"><span class="casc-e casc-l" style="width:34%"></span><span class="casc-e casc-d" style="width:66%"></span><span class="casc-e casc-l" style="width:54%"></span></div>
      <div class="casc-ind casc-admin-only"><div><span class="casc-e casc-g" style="width:30%"></span><span class="casc-e casc-l" style="width:70%"></span></div><div><span class="casc-e casc-g" style="width:30%"></span><span class="casc-e casc-l" style="width:80%"></span></div><div><span class="casc-e casc-g" style="width:30%"></span><span class="casc-e casc-l" style="width:76%"></span></div><div><span class="casc-e casc-g" style="width:30%"></span><span class="casc-e casc-l" style="width:72%"></span></div></div>
      <div class="casc-semana casc-admin-only"><span class="casc-e"></span><span class="casc-e"></span><span class="casc-e"></span><span class="casc-e"></span><span class="casc-e"></span></div>
    </main>
    <div class="casc-nav"></div>
    <div class="casc-login-placa"><span class="casc-e casc-g" style="width:60%"></span><span class="casc-e casc-l" style="width:40%"></span><span class="casc-e casc-b"></span><span class="casc-e casc-b"></span><span class="casc-e casc-b" style="background:#F2C200"></span></div>
  </div>
</div>
<script>
// Cascarón: la forma de la primera pantalla según la sesión guardada (la
// misma regla que SESSION.leer, api.js). Sin sesión, el fondo del Login.
(function () {
  try {
    var c = document.getElementById('cu-cascaron');
    var exp = parseInt(localStorage.getItem('cu_sesion_expira') || '0', 10);
    var hash = localStorage.getItem('cu_hash') || sessionStorage.getItem('cu_hash');
    if (!exp || Date.now() > exp || !hash) return;
    var rol = String(localStorage.getItem('cu_rol') || '').toUpperCase();
    c.className = 'casc ' + (rol === 'ADMIN' || rol === 'SUPERVISOR' ? 'casc-admin' : 'casc-insp');
  } catch (e) { /* sin almacenamiento: queda el del Login */ }
})();
</script>

<!-- React (Babel-standalone eliminado: el bundle se pre-transpila con esbuild) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" defer></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" defer></script>

<!-- ─────────────────────────────────────────────────────────────

<!-- Registro del Service Worker (cache de assets estáticos) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg) {
        console.log('[SW] registrado, scope:', reg.scope);
        // Si hay un SW nuevo esperando, pedirle skipWaiting → tomará control
        // y disparará 'controllerchange' (handler único debajo se encarga del reload).
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function() {
            // Cuando el nuevo SW termina de instalar y ya hay un controller previo,
            // significa que hay una versión esperando: pedirle activarse.
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[SW] versión nueva instalada, activando...');
              nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(function(e) { console.warn('[SW] fallo registro:', e); });

    // Único punto de reload: cuando un SW nuevo toma control de la pestaña.
    // En la primera carga (sin controller previo) no se dispara — evita
    // el reload espurio del primer ingreso.
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (refreshing) return;
      refreshing = true;
      console.log('[SW] controller cambió, recargando...');
      window.location.reload();
    });
  });
}
</script>
